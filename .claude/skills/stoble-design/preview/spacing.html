<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Spacing / 4-pt Scale" subtitle="4 → 120 px" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stoble — Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:'Garnett'; }
  .wrap { padding:16px 22px; display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; align-items:center; gap:14px; }
  .label { width:50px; font: 500 11px/1 'Garnett'; color:var(--fg-subtle); text-transform:uppercase; letter-spacing:0.06em; }
  .num { width:48px; font: 400 11px/1 var(--font-mono); color:var(--fg-subtle); }
  .bar { background: var(--sto-navy); height:14px; border-radius:2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row"><div class="label">1</div><div class="num">4px</div><div class="bar" style="width:4px"></div></div>
    <div class="row"><div class="label">2</div><div class="num">8px</div><div class="bar" style="width:8px"></div></div>
    <div class="row"><div class="label">3</div><div class="num">12px</div><div class="bar" style="width:12px"></div></div>
    <div class="row"><div class="label">4</div><div class="num">16px</div><div class="bar" style="width:16px"></div></div>
    <div class="row"><div class="label">5</div><div class="num">20px</div><div class="bar" style="width:20px"></div></div>
    <div class="row"><div class="label">6</div><div class="num">24px</div><div class="bar" style="width:24px"></div></div>
    <div class="row"><div class="label">7</div><div class="num">32px</div><div class="bar" style="width:32px"></div></div>
    <div class="row"><div class="label">8</div><div class="num">40px</div><div class="bar" style="width:40px"></div></div>
    <div class="row"><div class="label">9</div><div class="num">56px</div><div class="bar" style="width:56px"></div></div>
    <div class="row"><div class="label">10</div><div class="num">80px</div><div class="bar" style="width:80px"></div></div>
    <div class="row"><div class="label">11</div><div class="num">120px</div><div class="bar" style="width:120px"></div></div>
  </div>
</body>
</html>
