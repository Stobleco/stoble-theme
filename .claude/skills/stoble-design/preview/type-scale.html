<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Type / Scale" subtitle="Display → caption" viewport="700x350" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stoble — Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  .wrap { padding:16px 22px; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:baseline; gap:14px; border-bottom:1px dashed var(--border); padding-bottom:6px; }
  .row:last-child { border:0; }
  .label { width:78px; font: 500 11px/1 'Garnett'; color:var(--fg-subtle); text-transform:uppercase; letter-spacing:0.06em; }
  .size { width:60px; font: 400 11px/1 var(--font-mono); color:var(--fg-subtle); }
  .text { font-family: 'P22 Mackinac'; color: var(--sto-navy); letter-spacing:-0.015em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row"><div class="label">display</div><div class="size">72</div><div class="text" style="font-size:56px;line-height:1">better.</div></div>
    <div class="row"><div class="label">h1</div><div class="size">56</div><div class="text" style="font-size:42px;line-height:1">better together.</div></div>
    <div class="row"><div class="label">h2</div><div class="size">40</div><div class="text" style="font-size:32px;line-height:1.1">single-origin.</div></div>
    <div class="row"><div class="label">h3</div><div class="size">30</div><div class="text" style="font-size:26px;line-height:1.15">flagship blend.</div></div>
    <div class="row"><div class="label">h4</div><div class="size">22</div><div class="text" style="font-size:20px;line-height:1.2">lovingly roasted in chico.</div></div>
    <div class="row"><div class="label">body</div><div class="size">16</div><div class="text" style="font-size:16px;line-height:1.25">a good cup is the start of every day.</div></div>
    <div class="row"><div class="label">subhead</div><div class="size">14.75</div><div class="text" style="font-family:'Garnett';font-size:14px;line-height:1.22">subhead, garnett regular</div></div>
    <div class="row"><div class="label">caption</div><div class="size">12</div><div class="text" style="font-family:'Garnett';font-size:12px;line-height:1.3;color:var(--fg-subtle)">caption · timestamps · meta</div></div>
  </div>
</body>
</html>
