<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Type / Garnett" subtitle="Supporting sans" viewport="700x290" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stoble — Garnett Specimen</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  .wrap { padding:18px 22px; }
  .name { font: 500 12px/1 'Garnett'; color:var(--fg-subtle); text-transform:uppercase; letter-spacing:0.08em; }
  .subname { font: 400 11px/1.2 'Garnett'; color:var(--fg-subtle); margin-top:4px; text-transform:lowercase; }
  .glyphs { font: 400 30px/1.15 'Garnett'; color:var(--sto-navy); margin-top:12px; }
  .glyphs .small { font-size: 22px; color: var(--fg-muted); }
  .weights { margin-top:14px; display:grid; gap:3px; }
  .weights div { font-family: 'Garnett'; font-size:16px; color:var(--sto-navy); }
  .arrows { margin-top:10px; font: 500 24px 'Garnett'; color:var(--sto-navy); letter-spacing:0.15em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="name">garnett</div>
    <div class="subname">supporting sans — subheads, short-form, furniture. ≈90% of mackinac when paired inline.</div>
    <div class="glyphs">abcdefghijklmnopqrstuvwxyz<br/><span class="small">0123456789</span></div>
    <div class="weights">
      <div style="font-weight:300">light — captions.</div>
      <div style="font-weight:400">regular — body, furniture.</div>
      <div style="font-weight:500">medium — ui labels.</div>
      <div style="font-weight:600">semibold — eyebrows, badges.</div>
      <div style="font-weight:700">bold — buttons, emphasis.</div>
    </div>
    <div class="arrows">← ↖ ↑ ↗ → ↘ ↓ ↙</div>
  </div>
</body>
</html>
