<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Components / Buttons" subtitle="Primary, secondary, ghost" viewport="700x260" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stoble — Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:'Garnett'; }
  .wrap { padding:18px 22px; display:grid; gap:14px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .label { font: 600 10.5px/1 'Garnett'; color:var(--fg-subtle); text-transform:uppercase; letter-spacing:0.08em; width:64px; }
  .btn { font: 500 14px/1 'Garnett'; padding: 12px 20px; border-radius: 999px; border: 1.5px solid transparent; cursor: pointer; text-transform:lowercase; display:inline-flex; align-items:center; gap:8px; transition: all 180ms cubic-bezier(0.22,1,0.36,1); }
  .btn.primary { background: var(--sto-navy); color: var(--sto-light-gray); }
  .btn.primary:hover { background: #073744; }
  .btn.secondary { background: transparent; color: var(--sto-navy); border-color: var(--sto-navy); }
  .btn.secondary:hover { background: var(--sto-navy); color: var(--sto-light-gray); }
  .btn.ghost { background: transparent; color: var(--sto-navy); }
  .btn.ghost:hover { background: rgba(5,65,79,0.06); }
  .btn.small { padding: 8px 14px; font-size: 13px; }
  .btn.large { padding: 16px 28px; font-size: 16px; }
  .btn .arrow { font-size: 1em; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row"><div class="label">primary</div>
      <button class="btn primary">order coffee  →</button>
      <button class="btn primary small">subscribe</button>
      <button class="btn primary large">visit the shop  →</button>
    </div>
    <div class="row"><div class="label">secondary</div>
      <button class="btn secondary">learn more  →</button>
      <button class="btn secondary small">menu</button>
    </div>
    <div class="row"><div class="label">ghost</div>
      <button class="btn ghost">read the journal  →</button>
      <button class="btn ghost small">cancel</button>
    </div>
  </div>
</body>
</html>
