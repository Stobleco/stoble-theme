<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand / Better Together" subtitle="Generative — animates between forms, takes any text" viewport="700x320" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stoble — Better Together (generative)</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:'Garnett'; }
  .wrap { padding:0; display:grid; grid-template-rows: 1fr auto; height: 100vh; }
  .stage { position:relative; overflow:hidden; }
  .stage svg { width:100%; height:100%; display:block; }
  .stage text {
    font-family: 'Garnett', sans-serif;
    font-weight: 500;
    font-size: 26px;
    fill: var(--sto-navy);
    text-anchor: middle;
    dominant-baseline: central;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    user-select: none;
  }
  .chrome {
    display:flex; align-items:center; justify-content:space-between;
    gap: 14px;
    padding: 10px 14px; border-top: 1px solid var(--border);
    background: var(--bg-elevated);
    font: 500 11px/1 'Garnett'; color: var(--fg-subtle);
    text-transform: lowercase; letter-spacing:0.04em;
  }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip {
    padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent;
    font: 500 10.5px/1 'Garnett'; color: var(--fg-subtle);
    text-transform: lowercase; transition: all 160ms;
    cursor: pointer;
  }
  .chip.is-active { background: var(--sto-navy); color: var(--sto-light-gray); border-color: var(--sto-navy); }
  .right { display:flex; align-items:center; gap:14px; }
  .toggle {
    display:inline-flex; align-items:center; gap:8px;
    background: transparent; border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 5px 5px 12px; cursor: pointer;
    font: 500 10.5px/1 'Garnett'; color: var(--fg-subtle); text-transform: lowercase;
  }
  .toggle .track {
    width: 26px; height: 14px; border-radius: 999px; background: rgba(5,65,79,0.18);
    position: relative; transition: background 200ms;
  }
  .toggle .track::after {
    content:""; position:absolute; left:2px; top:2px; width:10px; height:10px;
    border-radius:999px; background: var(--bg-elevated); transition: transform 200ms;
  }
  .toggle.is-on { color: var(--sto-navy); border-color: var(--sto-navy); }
  .toggle.is-on .track { background: var(--sto-navy); }
  .toggle.is-on .track::after { transform: translateX(12px); }
  .hint code { font: 500 10.5px/1 var(--font-mono); color: var(--sto-navy); background: rgba(5,65,79,0.06); padding: 4px 6px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <svg id="bt" viewBox="0 0 700 280" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="chrome">
      <div class="chips" id="chips"></div>
      <div class="right">
        <button id="motion" class="toggle is-on" type="button">
          motion <span class="track"></span>
        </button>
        <span class="hint"><code>&lt;BetterTogether form="wave" motion /&gt;</code></span>
      </div>
    </div>
  </div>

<script>
(() => {
  // ─────────────────────────────────────────────────────────────
  // Better Together — generative SVG text-on-curve component.
  //   • Forms are parametric paths: (s, t) → {x, y}.
  //   • Arc-length-distributed letters using a precomputed table
  //     per form (built at t=0; time perturbations preserve length).
  //   • Tangent rotation, computed numerically per frame.
  //   • Each form has a tangent flag (column/drift = upright letters).
  //   • Idle motion: form-specific subtle animation when settled.
  //   • Single click handler; toggle to freeze motion.
  // ─────────────────────────────────────────────────────────────

  const svg = document.getElementById('bt');
  const chipsEl = document.getElementById('chips');
  const motionBtn = document.getElementById('motion');

  const W = 700, H = 280;
  const CX = W / 2, CY = H / 2;
  const PAD = 70;

  const TEXT = "BETTER TOGETHER";
  const chars = TEXT.split('');

  // ───── Form definitions ─────
  // (s, t) ∈ [0,1] × seconds → {x, y}
  const FORMS = {
    wave: (s, t) => ({
      x: PAD + s * (W - 2 * PAD),
      y: CY + Math.sin(s * Math.PI * 1.8 + t * 1.2) * 58 - 10,
    }),
    arch: (s, t) => {
      // rainbow half-circle reading L→R, with gentle side-to-side rotational wobble
      const theta = Math.PI - s * Math.PI;
      const rx = 270, ry = 175;
      const x0 = Math.cos(theta) * rx;
      const y0 = -Math.sin(theta) * ry;
      const wobble = Math.sin(t * 0.7) * 0.06;   // ±3.4°
      const c = Math.cos(wobble), si = Math.sin(wobble);
      return { x: CX + x0 * c - y0 * si, y: CY + 90 + x0 * si + y0 * c };
    },
    smile: (s, t) => {
      // U-curve (face-smile): corners UP, middle DIPS DOWN. Depth breathes.
      const x = PAD + s * (W - 2 * PAD);
      const depth = 130 + Math.sin(t * 0.85) * 22;
      const y = CY + 70 - Math.pow(s - 0.5, 2) * 4 * depth;
      return { x, y };
    },
    boomerang: (s, t) => ({
      x: PAD + s * (W - 2 * PAD),
      y: CY + Math.sin(s * Math.PI * 2.4 + t * 1.5) * 64,
    }),
    column: (s, t) => ({
      // tight vertical stack, modest sinuous horizontal weave, letters upright
      x: CX + Math.sin(s * Math.PI * 3.2 + t * 0.6) * 44,
      y: 32 + s * (H - 64),
    }),
    ring: (s, t) => {
      const theta = -Math.PI / 2 + s * Math.PI * 2 + t * 0.18;
      const r = Math.min(W, H) * 0.40;
      return { x: CX + Math.cos(theta) * r, y: CY + Math.sin(theta) * r };
    },
    drift: (s, t) => {
      const x = PAD + s * (W - 2 * PAD);
      const y = CY + Math.sin(s * 6.3 + 1.2 + t * 0.5) * 18
                   + Math.sin(s * 13.1 + t * 0.9) * 8;
      return { x, y };
    },
    straight: (s, t) => ({
      x: PAD + s * (W - 2 * PAD),
      y: CY + Math.sin(s * 18 + t * 2.2) * 1.6,
    }),
  };
  const FORM_KEYS = Object.keys(FORMS);

  // tangent flag: should letters rotate to the path tangent, or stay upright?
  const TANGENT = {
    wave: true, arch: true, smile: true, boomerang: true,
    column: false, ring: true, drift: false, straight: false,
  };

  // ─────────────────────────────────────────────────────────────
  // Arc-length distribution — precompute s-per-letter at t=0.
  // Time perturbations on each form preserve arc length (or close
  // enough that visual spacing stays stable).
  // ─────────────────────────────────────────────────────────────
  const SAMPLES = 400;
  function buildArcTable(formName) {
    const f = FORMS[formName];
    const cum = new Float32Array(SAMPLES + 1);
    let prev = f(0, 0);
    cum[0] = 0;
    for (let i = 1; i <= SAMPLES; i++) {
      const p = f(i / SAMPLES, 0);
      cum[i] = cum[i - 1] + Math.hypot(p.x - prev.x, p.y - prev.y);
      prev = p;
    }
    return { cum, total: cum[SAMPLES] };
  }
  function sAtArc(table, arc) {
    const { cum, total } = table;
    if (arc <= 0) return 0;
    if (arc >= total) return 1;
    let lo = 0, hi = SAMPLES;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (cum[mid] < arc) lo = mid + 1;
      else hi = mid;
    }
    const i1 = lo, i0 = Math.max(0, lo - 1);
    const seg = cum[i1] - cum[i0];
    const frac = seg > 0 ? (arc - cum[i0]) / seg : 0;
    return (i0 + frac) / SAMPLES;
  }
  // SPACE gets a wider arc slot so word breaks read as breaks.
  function weight(ch) { return ch === ' ' ? 1.4 : 1.0; }
  const weights = chars.map(weight);
  const totalWeight = weights.reduce((a, b) => a + b, 0);
  const arcFracs = (() => {
    const out = []; let cum = 0;
    for (let i = 0; i < chars.length; i++) {
      out.push((cum + weights[i] / 2) / totalWeight);
      cum += weights[i];
    }
    return out;
  })();

  // Per-form: arc table, then per-letter s value
  const formData = {};
  for (const k of FORM_KEYS) {
    const table = buildArcTable(k);
    formData[k] = { table, sPerLetter: arcFracs.map(f => sAtArc(table, f * table.total)) };
  }

  // Position + tangent for letter i in form, at time t.
  function letterAt(formName, i, t) {
    const s = formData[formName].sPerLetter[i];
    const f = FORMS[formName];
    const p = f(s, t);
    let rot = 0;
    if (TANGENT[formName]) {
      const eps = 0.004;
      const sa = Math.max(0, s - eps), sb = Math.min(1, s + eps);
      const pa = f(sa, t), pb = f(sb, t);
      rot = Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI;
    }
    return { x: p.x, y: p.y, rot };
  }

  // ───── Build letters ─────
  const letterEls = chars.map((ch) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.textContent = ch === ' ' ? '' : ch;
    svg.appendChild(t);
    return t;
  });

  // ───── Chips ─────
  FORM_KEYS.forEach((k) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.form = k;
    b.textContent = k;
    chipsEl.appendChild(b);
  });

  // ─────────────────────────────────────────────────────────────
  // Animation state — single source of truth.
  // ─────────────────────────────────────────────────────────────
  const DWELL_MS = 2400;
  const TWEEN_MS = 1300;

  let motionOn = true;
  let toForm = 'arch';
  let fromForm = 'wave';
  let fromCaptured = chars.map((_, i) => letterAt('wave', i, 0)); // initial start
  let progress = 0;
  let dwellLeft = 0;
  let lastTs = 0;
  let time = 0;     // seconds, advances when motionOn

  function easeInOutCubic(x) {
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  function lerpAngle(a, b, t) {
    const d = ((b - a + 540) % 360) - 180;
    return a + d * t;
  }

  function paintLetter(i) {
    const n = chars.length;
    const stagger = n > 1 ? i / (n - 1) : 0;
    const local = Math.max(0, Math.min(1, (progress - stagger * 0.15) / 0.85));
    const e = easeInOutCubic(local);

    const a = fromCaptured[i];
    const b = letterAt(toForm, i, time);
    const x = lerp(a.x, b.x, e);
    const y = lerp(a.y, b.y, e);
    const rot = lerpAngle(a.rot, b.rot, e);

    const el = letterEls[i];
    el.setAttribute('x', x.toFixed(2));
    el.setAttribute('y', y.toFixed(2));
    el.setAttribute('transform', `rotate(${rot.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)})`);
    return { x, y, rot };
  }
  function snapshotCurrent() {
    return chars.map((_, i) => {
      // computed positions = same as paintLetter's pre-write values
      const n = chars.length;
      const stagger = n > 1 ? i / (n - 1) : 0;
      const local = Math.max(0, Math.min(1, (progress - stagger * 0.15) / 0.85));
      const e = easeInOutCubic(local);
      const a = fromCaptured[i];
      const b = letterAt(toForm, i, time);
      return {
        x: lerp(a.x, b.x, e),
        y: lerp(a.y, b.y, e),
        rot: lerpAngle(a.rot, b.rot, e),
      };
    });
  }
  function paintChips() {
    [...chipsEl.children].forEach((el) => {
      el.classList.toggle('is-active', el.dataset.form === toForm);
    });
  }
  function transitionTo(name) {
    if (name === toForm && progress >= 1) return;
    fromCaptured = snapshotCurrent();
    fromForm = toForm;
    toForm = name;
    progress = 0;
    dwellLeft = DWELL_MS;
    paintChips();
  }

  // Single delegated click for form chips.
  chipsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    transitionTo(btn.dataset.form);
  });

  // Motion toggle.
  motionBtn.addEventListener('click', () => {
    motionOn = !motionOn;
    motionBtn.classList.toggle('is-on', motionOn);
  });

  function frame(ts) {
    if (!lastTs) lastTs = ts;
    const dt = ts - lastTs;
    lastTs = ts;

    if (motionOn) time += dt / 1000;

    if (progress < 1) {
      progress = Math.min(1, progress + dt / TWEEN_MS);
    } else {
      dwellLeft -= dt;
      if (dwellLeft <= 0) {
        const idx = FORM_KEYS.indexOf(toForm);
        const next = FORM_KEYS[(idx + 1) % FORM_KEYS.length];
        fromCaptured = snapshotCurrent();
        fromForm = toForm;
        toForm = next;
        progress = 0;
        dwellLeft = DWELL_MS;
        paintChips();
      }
    }

    for (let i = 0; i < chars.length; i++) paintLetter(i);
    requestAnimationFrame(frame);
  }

  paintChips();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
