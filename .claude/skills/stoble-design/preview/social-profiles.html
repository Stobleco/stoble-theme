<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Brand / Social Profiles" subtitle="Instagram avatars" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stoble — Social Profile</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:'Garnett'; }
  .wrap { padding:18px; display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
  .tile { border-radius: 12px; overflow:hidden; border:1px solid var(--border); aspect-ratio: 1/1; display:flex; align-items:center; justify-content:center; }
  .tile img { width:100%; height:100%; object-fit:cover; }
  .cap { text-align:center; font: 500 11px/1.2 'Garnett'; color: var(--fg-subtle); margin-top:6px; text-transform:lowercase; }
  .col { display:flex; flex-direction:column; gap:4px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><div class="tile"><img src="../assets/social-primary.png"/></div><div class="cap">@stoblecoffee — primary</div></div>
    <div class="col"><div class="tile"><img src="../assets/social-events.png"/></div><div class="cap">@stoble events</div></div>
    <div class="col"><div class="tile"><img src="../assets/social-workplace.png"/></div><div class="cap">@stoble workplace</div></div>
  </div>
</body>
</html>
