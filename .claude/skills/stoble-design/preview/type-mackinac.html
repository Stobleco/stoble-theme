<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Type / P22 Mackinac" subtitle="Primary brand serif" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stoble — Mackinac Specimen</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  .wrap { padding:18px 22px; }
  .name { font: 500 12px/1 'Garnett'; color:var(--fg-subtle); text-transform:uppercase; letter-spacing:0.08em; }
  .subname { font: 400 11px/1.2 'Garnett'; color:var(--fg-subtle); margin-top:4px; text-transform:lowercase; }
  .glyphs { font: 400 38px/1.1 'P22 Mackinac'; color:var(--sto-navy); letter-spacing:-0.01em; margin-top:12px; }
  .glyphs .small { font-size: 24px; color: var(--fg-muted); }
  .weights { margin-top:14px; display:grid; gap:4px; }
  .weights div { font-family: 'P22 Mackinac'; font-size:22px; color:var(--sto-navy); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="name">p22 mackinac</div>
    <div class="subname">primary serif — headlines, long-form, conversational body. lowercase 90% of the time.</div>
    <div class="glyphs">abcdefghijklmnopqrstuvwxyz<br/><span class="small">0123456789  &amp;  ?  !  →  ↑</span></div>
    <div class="weights">
      <div style="font-weight:400">book — the workhorse.</div>
      <div style="font-weight:500">medium — for emphasis.</div>
      <div style="font-weight:700">bold — sparingly, never all-caps.</div>
    </div>
  </div>
</body>
</html>
