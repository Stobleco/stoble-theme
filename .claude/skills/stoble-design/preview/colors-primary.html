<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Colors / Primary" subtitle="Navy, mid-gray, light gray" viewport="700x250" -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stoble — Brand Colors (Primary)</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin:0; background:var(--bg); font-family:var(--font-sans); color:var(--fg); }
  .grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:14px; padding:18px; }
  .sw { border-radius: var(--r-md); overflow:hidden; border:1px solid var(--border); display:flex; flex-direction:column; height:200px; }
  .chip { flex:1; }
  .meta { padding:10px 12px; background:var(--bg-elevated); display:flex; flex-direction:column; gap:2px; }
  .name { font: 500 14px/1.1 var(--font-sans); color:var(--fg); text-transform:lowercase; }
  .hex { font: 400 12px/1.2 var(--font-mono); color:var(--fg-subtle); letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw">
      <div class="chip" style="background:#05414F"></div>
      <div class="meta"><div class="name">stoble navy</div><div class="hex">#05414F · PMS 2217</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#97A3AE"></div>
      <div class="meta"><div class="name">mid gray</div><div class="hex">#97A3AE · PMS 7543</div></div>
    </div>
    <div class="sw">
      <div class="chip" style="background:#F4F1ED; border-bottom:1px solid var(--border);"></div>
      <div class="meta"><div class="name">light gray</div><div class="hex">#F4F1ED · neutral</div></div>
    </div>
  </div>
</body>
</html>
